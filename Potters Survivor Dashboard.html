<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pottersmith Survivor 50 · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<template id="__bundler_thumbnail">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#1a1208"/>
  <rect x="80" y="80" width="1040" height="640" fill="#f1e6cf" stroke="#8a6a3f" stroke-width="3"/>
  <rect x="100" y="100" width="1000" height="600" fill="none" stroke="#8a6a3f" stroke-width="1" opacity="0.5"/>
  <g transform="translate(600 290)">
    <ellipse cx="0" cy="80" rx="120" ry="14" fill="#8a6a3f" opacity="0.5"/>
    <path d="M-90 80 Q-100 -20 -50 -60 Q0 -80 50 -60 Q100 -20 90 80 Z" fill="#c29a2c" stroke="#8a6a3f" stroke-width="3"/>
    <ellipse cx="0" cy="-60" rx="60" ry="14" fill="#3a2812"/>
    <ellipse cx="0" cy="-60" rx="48" ry="8" fill="#1a1208"/>
  </g>
  <text x="600" y="500" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="72" fill="#2a1d10" letter-spacing="10">SURVIVOR</text>
  <text x="600" y="560" text-anchor="middle" font-family="Arial" font-weight="700" font-size="22" fill="#3f8f4a" letter-spacing="10">POTTERSMITH 50</text>
</svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data-potters.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "seasonNumber": "50",
  "showTrajectory": true,
  "showPower": true,
  "showAccuracy": false,
  "paperTone": "parchment"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const tones = {
      parchment: { paper: "#f1e6cf", paper2: "#e8d9b8", paper3: "#d8c39a" },
      ash:       { paper: "#e6dccd", paper2: "#d8cdbb", paper3: "#c4b89e" },
      jungle:    { paper: "#ecead0", paper2: "#dcd9b6", paper3: "#c8c49a" },
    };
    const t = tones[tweaks.paperTone] || tones.parchment;
    document.documentElement.style.setProperty("--ssx-paper", t.paper);
    document.documentElement.style.setProperty("--ssx-paper-2", t.paper2);
    document.documentElement.style.setProperty("--ssx-paper-3", t.paper3);
  }, [tweaks.paperTone]);

  return (
    <div className="ssx-app">
      <SurvivorHeader tweaks={tweaks} />

      <ChampionBanner />

      <SeasonAtAGlance />

      <div className="ssx-section-title">
        <div className="ssx-section-title__line"></div>
        <h2>THE LEADERBOARD</h2>
        <div className="ssx-section-title__line"></div>
      </div>
      <div className="ssx-row ssx-row--standings">
        <Standings />
        {tweaks.showTrajectory && <TrajectoryChart />}
      </div>

      <div className="ssx-section-title">
        <div className="ssx-section-title__line"></div>
        <h2>THE TRIBES</h2>
        <div className="ssx-section-title__line"></div>
      </div>
      <div className="ssx-row ssx-row--rosters">
        <TeamRosters />
      </div>

      <div className="ssx-section-title">
        <div className="ssx-section-title__line"></div>
        <h2>STRATEGIC INTEL</h2>
        <div className="ssx-section-title__line"></div>
      </div>
      <div className="ssx-row ssx-row--rosters">
        <RecentEliminations />
      </div>
      <div className="ssx-row ssx-row--side">
        <GoldenSnitch />
      </div>

      {tweaks.showAccuracy && D.predictions.length > 0 && (
        <div className="ssx-row ssx-row--rosters">
          <PredictionAccuracy />
        </div>
      )}

      {tweaks.showPower && (
        <>
          <div className="ssx-section-title">
            <div className="ssx-section-title__line"></div>
            <h2>WHO CAN STILL WIN?</h2>
            <div className="ssx-section-title__line"></div>
          </div>
          <div className="ssx-row ssx-row--rosters">
            <PowerRankings />
          </div>
        </>
      )}

      <footer className="ssx-footer">
        OUTWIT <span className="ssx-footer__divider">◆</span> OUTPLAY <span className="ssx-footer__divider">◆</span> OUTLAST
        <div style={{marginTop: 6, opacity: 0.7}}>POTTERSMITH SURVIVOR 50 · {D.meta.updated.toUpperCase()}</div>
      </footer>

      <TweaksPanel title="Dashboard Tweaks">
        <TweakSection title="Header">
          <TweakText label="Season number" value={tweaks.seasonNumber} onChange={v => setTweak("seasonNumber", v)} />
        </TweakSection>
        <TweakSection title="Theme">
          <TweakRadio label="Paper tone" value={tweaks.paperTone}
            onChange={v => setTweak("paperTone", v)}
            options={[
              {value: "parchment", label: "Parchment"},
              {value: "ash", label: "Ash"},
              {value: "jungle", label: "Jungle"},
            ]}/>
        </TweakSection>
        <TweakSection title="Sections">
          <TweakToggle label="Show trajectory chart" value={tweaks.showTrajectory} onChange={v => setTweak("showTrajectory", v)} />
          <TweakToggle label="Show power rankings" value={tweaks.showPower} onChange={v => setTweak("showPower", v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
